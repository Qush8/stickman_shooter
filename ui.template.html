<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bordiko Platformer Shooter - PixiJS</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1e1e1e;
      font-family: sans-serif;
    }
    #game-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: crosshair;
    }
    #game-container canvas {
      image-rendering: auto;
    }
    #hud {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      color: white;
    }
    #hud-top-left {
      position: absolute;
      top: 20px; left: 20px;
      text-shadow: 1px 1px 2px black;
    }
    #hud-game-over {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
      color: #ffaa00;
      text-align: center;
      font-weight: bold;
      display: none;
      background: rgba(0,0,0,0.7);
      padding: 30px;
      border-radius: 10px;
      text-shadow: 2px 2px 4px black;
    }
    #labels-container {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden;
    }
    .player-hud {
      position: absolute;
      top: 0; left: 0;
      pointer-events: none;
      will-change: transform;
    }
    .player-label {
      position: absolute;
      left: 0; top: -20px;
      transform: translate(-50%, -100%);
      font-size: 10px;
      color: white;
      text-align: center;
      text-shadow: 1px 1px 2px black;
      white-space: nowrap;
    }
    .health-bar-bg {
      position: absolute;
      left: 0; top: -12px;
      width: 36px; height: 5px;
      background: #555;
      transform: translateX(-50%);
      border: 1px solid #222;
    }
    .health-bar-fg {
      height: 100%;
      background: #55ff55;
      width: 100%;
      transition: width 0.1s;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="hud">
    <div id="hud-top-left">
      <div id="player-info"></div>
      <div id="turn-info" style="color: #55ff55;"></div>
      <div id="scores-info" style="margin-top: 10px; color: #aaffaa;"></div>
    </div>
    <div id="hud-game-over"></div>
    <div id="labels-container"></div>
  </div>

  <script src="https://pixijs.download/v7.3.2/unsafe-eval.min.js"></script>
  <!-- INJECT_SCRIPT -->

</body>
</html>
